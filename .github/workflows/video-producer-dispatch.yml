name: Video Producer dispatcher

on:
  repository_dispatch:
    types: [video-producer-transcribe, video-producer-sync, video-producer-render, video-producer-thumbnail, video-producer-publisher-handoff, video-producer-agent-preview, video-producer-youtube-schedule]

permissions:
  contents: read

jobs:
  transcribe:
    if: github.event.action == 'video-producer-transcribe'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WORKER_REF: ${{ github.event.client_payload.worker_ref || github.event.repository.default_branch }}
    steps:
      - name: Validate worker ref
        shell: bash
        run: |
          case "$WORKER_REF" in
            main|codex/video-producer|codex/video-producer-brand-episodes) ;;
            *) echo "Refusing untrusted Video Producer worker ref: $WORKER_REF" >&2; exit 1 ;;
          esac
      - name: Check out requested worker ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORKER_REF }}
          persist-credentials: false
      - name: Prepare ffmpeg
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Write worker payload
        env:
          WORKER_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: printf '%s' "$WORKER_PAYLOAD" > /tmp/video-producer-transcribe.json
      - name: Extract, chunk, transcribe, and report
        env:
          VIDEO_PRODUCER_OPENAI_API_KEY: ${{ secrets.VIDEO_PRODUCER_OPENAI_API_KEY }}
        run: |
          if [ -z "$VIDEO_PRODUCER_OPENAI_API_KEY" ]; then
            echo "VIDEO_PRODUCER_OPENAI_API_KEY repository secret is required for Video Producer transcription." >&2
            exit 1
          fi
          python3 scripts/transcribe_video_producer_worker.py /tmp/video-producer-transcribe.json

  sync:
    if: github.event.action == 'video-producer-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WORKER_REF: ${{ github.event.client_payload.worker_ref || github.event.repository.default_branch }}
    steps:
      - name: Validate worker ref
        shell: bash
        run: |
          case "$WORKER_REF" in
            main|codex/video-producer|codex/video-producer-brand-episodes) ;;
            *) echo "Refusing untrusted Video Producer worker ref: $WORKER_REF" >&2; exit 1 ;;
          esac
      - name: Check out requested worker ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORKER_REF }}
          persist-credentials: false
      - name: Prepare waveform analyzer
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg python3-numpy
      - name: Write sync payload
        env:
          WORKER_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: printf '%s' "$WORKER_PAYLOAD" > /tmp/video-producer-sync.json
      - name: Correlate Camera A and attached media
        run: python3 scripts/sync_video_producer_worker.py /tmp/video-producer-sync.json

  render:
    if: github.event.action == 'video-producer-render'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      WORKER_REF: ${{ github.event.client_payload.worker_ref || github.event.repository.default_branch }}
    steps:
      - name: Validate worker ref
        shell: bash
        run: |
          case "$WORKER_REF" in
            main|codex/video-producer|codex/video-producer-brand-episodes) ;;
            *) echo "Refusing untrusted Video Producer worker ref: $WORKER_REF" >&2; exit 1 ;;
          esac
      - name: Check out requested worker ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORKER_REF }}
          persist-credentials: false
      - name: Prepare ffmpeg, AG fonts, and curl
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg curl fonts-noto-core fontconfig
          for pkg in fonts-bebas-neue fonts-montserrat fonts-playfair-display; do
            if apt-cache show "$pkg" >/dev/null 2>&1; then
              sudo apt-get install -y --no-install-recommends "$pkg"
            fi
          done
          fc-cache -f >/dev/null 2>&1 || true
      - name: Write render payload
        env:
          RENDER_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: printf '%s' "$RENDER_PAYLOAD" > /tmp/video-producer-render.json
      - name: Detect V2 kinetic scenes
        id: kinetic
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          payload = json.load(open('/tmp/video-producer-render.json', encoding='utf-8'))
          with urllib.request.urlopen(payload['manifest_url'], timeout=90) as response:
              manifest = json.load(response)
          enabled = 'true' if manifest.get('kineticSceneV2') is not None else 'false'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('enabled=' + enabled + '\n')
          print('Chromium motion required:', enabled)
          PY
      - name: Setup Node for kinetic video
        if: steps.kinetic.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install kinetic renderer
        if: steps.kinetic.outputs.enabled == 'true'
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium --only-shell
      - name: Render, upload, and report status
        shell: bash
        run: |
          if [ -f scripts/render_video_producer_visual_pass_worker.py ]; then
            python3 scripts/render_video_producer_visual_pass_worker.py /tmp/video-producer-render.json /tmp/video-producer.mp4
          else
            python3 scripts/render_video_producer_finishing_worker.py /tmp/video-producer-render.json /tmp/video-producer.mp4
          fi
      - name: Keep failed render for diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: video-producer-failed-${{ github.run_id }}
          path: |
            /tmp/video-producer-render.json
            /tmp/video-producer.mp4
          if-no-files-found: ignore
          retention-days: 2

  thumbnails:
    if: github.event.action == 'video-producer-thumbnail'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WORKER_REF: ${{ github.event.client_payload.worker_ref || github.event.repository.default_branch }}
    steps:
      - name: Validate worker ref
        shell: bash
        run: |
          case "$WORKER_REF" in
            main|codex/video-producer|codex/video-producer-brand-episodes) ;;
            *) echo "Refusing untrusted Video Producer worker ref: $WORKER_REF" >&2; exit 1 ;;
          esac
      - name: Check out requested worker ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORKER_REF }}
          persist-credentials: false
      - name: Prepare thumbnail renderer
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg curl python3-opencv fonts-noto-core fontconfig
          for pkg in fonts-bebas-neue fonts-montserrat; do
            if apt-cache show "$pkg" >/dev/null 2>&1; then
              sudo apt-get install -y --no-install-recommends "$pkg"
            fi
          done
          fc-cache -f >/dev/null 2>&1 || true
      - name: Write thumbnail payload
        env:
          WORKER_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: printf '%s' "$WORKER_PAYLOAD" > /tmp/video-producer-thumbnail.json
      - name: Render real frame YouTube thumbnail candidates
        run: python3 scripts/video_producer_thumbnail_worker.py /tmp/video-producer-thumbnail.json

  publisher_handoff:
    if: github.event.action == 'video-producer-publisher-handoff'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WORKER_REF: ${{ github.event.client_payload.worker_ref || github.event.repository.default_branch }}
    steps:
      - name: Validate worker ref
        shell: bash
        run: |
          case "$WORKER_REF" in
            main|codex/video-producer|codex/video-producer-brand-episodes) ;;
            *) echo "Refusing untrusted Video Producer worker ref: $WORKER_REF" >&2; exit 1 ;;
          esac
      - name: Check out requested worker ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORKER_REF }}
          persist-credentials: false
      - name: Prepare transfer worker
        shell: bash
        run: |
          if ! command -v curl >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends curl
          fi
      - name: Write Publisher payload
        env:
          WORKER_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: printf '%s' "$WORKER_PAYLOAD" > /tmp/video-producer-publisher.json
      - name: Copy reviewed master to Publisher
        run: python3 scripts/video_producer_publisher_handoff_worker.py /tmp/video-producer-publisher.json

  agent_preview:
    if: github.event.action == 'video-producer-agent-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      WORKER_REF: ${{ github.event.client_payload.worker_ref || github.event.repository.default_branch }}
    steps:
      - name: Validate trusted worker ref
        shell: bash
        run: |
          case "$WORKER_REF" in
            main|codex/video-producer|codex/video-producer-brand-episodes) ;;
            *) echo "Refusing untrusted draft preview ref" >&2; exit 1 ;;
          esac
      - name: Check out saved scene renderer
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORKER_REF }}
          persist-credentials: false
      - name: Install ffmpeg and Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg curl fonts-noto-core fontconfig
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deterministic renderer
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium --only-shell
      - name: Save private signed preview payload
        env:
          PREVIEW_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: printf '%s' "$PREVIEW_PAYLOAD" > /tmp/video-producer-agent-preview.json
      - name: Render private ten second proof and report
        run: python3 scripts/render_video_producer_agent_preview_worker.py /tmp/video-producer-agent-preview.json

  youtube_schedule:
    if: github.event.action == 'video-producer-youtube-schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      WORKER_REF: ${{ github.event.client_payload.worker_ref || github.event.repository.default_branch }}
    steps:
      - name: Enforce trusted worker ref
        shell: bash
        run: |
          case "$WORKER_REF" in
            main|codex/video-producer|codex/video-producer-brand-episodes) ;;
            *) echo "Refusing untrusted scheduled upload worker ref" >&2; exit 1 ;;
          esac
      - name: Check out reviewed Video Producer worker
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORKER_REF }}
          persist-credentials: false
      - name: Write signed worker payload
        shell: bash
        env:
          WORKER_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: printf '%s' "$WORKER_PAYLOAD" > /tmp/video-producer-youtube-schedule.json
      - name: Stream resumable YouTube upload and finish metadata
        run: python3 scripts/video_producer_youtube_schedule_worker.py /tmp/video-producer-youtube-schedule.json
