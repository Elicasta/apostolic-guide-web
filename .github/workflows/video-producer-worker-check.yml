name: Video Producer worker check

on:
  pull_request:
    paths:
      - 'scripts/render_video_producer_worker.py'
      - 'scripts/render_video_producer_broadcast_worker.py'
      - 'scripts/render_video_producer_finishing_worker.py'
      - 'scripts/render_video_producer_visual_pass_worker.py'
      - 'scripts/video_producer_visual_import_worker.py'
      - 'scripts/video_producer_broadcast_graphics.py'
      - 'scripts/video_producer_broadcast_graphics_v2.py'
      - 'scripts/video_producer_thumbnail_worker.py'
      - 'scripts/video_producer_publisher_handoff_worker.py'
      - 'scripts/transcribe_video_producer_worker.py'
      - 'scripts/sync_video_producer_worker.py'
      - 'scripts/check_video_producer_worker.py'
      - 'scripts/check_video_producer_finishing.py'
      - 'scripts/check_video_producer_sync.py'
      - 'scripts/check_video_producer_multicam.py'
      - 'scripts/check_video_producer_visual_pass.py'
      - 'public/brand/**'
      - '.github/workflows/video-producer-worker-check.yml'
      - '.github/workflows/video-producer-dispatch.yml'
      - '.github/workflows/video-producer-visual-import.yml'

permissions:
  contents: read

jobs:
  transcription-readiness:
    name: transcription readiness
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify transcription secret
        env:
          VIDEO_PRODUCER_OPENAI_API_KEY: ${{ secrets.VIDEO_PRODUCER_OPENAI_API_KEY }}
        run: |
          if [ -z "$VIDEO_PRODUCER_OPENAI_API_KEY" ]; then
            echo "VIDEO_PRODUCER_OPENAI_API_KEY repository secret is required for Video Producer transcription." >&2
            exit 1
          fi
          echo "Dedicated Video Producer transcription secret is configured."

  smoke:
    name: media smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Install FFmpeg, NumPy, and AG fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg python3-numpy fonts-noto-core fontconfig
          for pkg in fonts-bebas-neue fonts-montserrat fonts-playfair-display; do
            if apt-cache show "$pkg" >/dev/null 2>&1; then
              sudo apt-get install -y --no-install-recommends "$pkg"
            fi
          done
          fc-cache -f >/dev/null 2>&1 || true

      - name: Compile Python workers
        run: |
          python3 -m py_compile \
            scripts/render_video_producer_worker.py \
            scripts/render_video_producer_broadcast_worker.py \
            scripts/render_video_producer_finishing_worker.py \
            scripts/render_video_producer_visual_pass_worker.py \
            scripts/video_producer_visual_import_worker.py \
            scripts/video_producer_broadcast_graphics.py \
            scripts/video_producer_broadcast_graphics_v2.py \
            scripts/video_producer_thumbnail_worker.py \
            scripts/video_producer_publisher_handoff_worker.py \
            scripts/transcribe_video_producer_worker.py \
            scripts/sync_video_producer_worker.py \
            scripts/check_video_producer_worker.py \
            scripts/check_video_producer_finishing.py \
            scripts/check_video_producer_sync.py \
            scripts/check_video_producer_multicam.py \
            scripts/check_video_producer_visual_pass.py

      - name: Verify waveform synchronization math
        run: python3 scripts/check_video_producer_sync.py

      - name: Render Podcast and Reels smoke files
        run: python3 scripts/check_video_producer_worker.py

      - name: Render Graphics V2, mastering, music, and thumbnail smoke files
        shell: bash
        run: |
          set +e
          python3 scripts/check_video_producer_finishing.py > /tmp/ag-finishing-smoke.log 2>&1
          status=$?
          cat /tmp/ag-finishing-smoke.log
          if [ "$status" -ne 0 ]; then
            diagnostic=$(tail -c 7000 /tmp/ag-finishing-smoke.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Finishing FFmpeg diagnostics::$diagnostic"
            exit "$status"
          fi

      - name: Render synchronized multicam and External Audio smoke file
        shell: bash
        run: |
          set +e
          python3 scripts/check_video_producer_multicam.py > /tmp/ag-multicam-smoke.log 2>&1
          status=$?
          cat /tmp/ag-multicam-smoke.log
          if [ "$status" -ne 0 ]; then
            diagnostic=$(tail -c 7000 /tmp/ag-multicam-smoke.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Multicam FFmpeg diagnostics::$diagnostic"
            exit "$status"
          fi

      - name: Render Visual Pass V3 smoke file
        shell: bash
        run: |
          set +e
          python3 scripts/check_video_producer_visual_pass.py > /tmp/ag-visual-pass-smoke.log 2>&1
          status=$?
          cat /tmp/ag-visual-pass-smoke.log
          if [ "$status" -ne 0 ]; then
            diagnostic=$(tail -c 7000 /tmp/ag-visual-pass-smoke.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Visual Pass V3 FFmpeg diagnostics::$diagnostic"
            exit "$status"
          fi
