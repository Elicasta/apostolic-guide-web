name: Video Producer Visual Pass import

on:
  repository_dispatch:
    types: [video-producer-visual-import]

permissions:
  contents: read

jobs:
  import_visual:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WORKER_REF: ${{ github.event.client_payload.worker_ref || github.event.repository.default_branch }}
    steps:
      - name: Validate worker ref
        shell: bash
        run: |
          case "$WORKER_REF" in
            main|codex/video-producer) ;;
            *) echo "Refusing untrusted Video Producer worker ref: $WORKER_REF" >&2; exit 1 ;;
          esac
      - name: Check out requested worker ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORKER_REF }}
          persist-credentials: false
      - name: Prepare media tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg curl
      - name: Write Visual Pass payload
        env:
          WORKER_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: printf '%s' "$WORKER_PAYLOAD" > /tmp/video-producer-visual-import.json
      - name: Download selected media, normalize, persist, and report
        run: python3 scripts/video_producer_visual_import_worker.py /tmp/video-producer-visual-import.json
