name: AG Studio checks

on:
  pull_request:
    paths:
      - 'app/studio/**'
      - 'app/output/**'
      - 'app/api/studio/**'
      - 'src/studio/**'
      - 'supabase/migrations/**ag_studio**'
      - 'tests/studio-*.test.ts'
      - '.github/workflows/ag-studio-checks.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
