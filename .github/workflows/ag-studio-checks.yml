name: AG Studio checks

on:
  pull_request:
    paths:
      - 'app/studio/**'
      - 'app/output/**'
      - 'app/admin/**'
      - 'app/api/studio/**'
      - 'app/api/admin/**'
      - 'app/api/cron/**'
      - 'src/studio/**'
      - 'src/creative-*.ts'
      - 'src/creative-*.tsx'
      - 'src/sol-*.ts'
      - 'src/sol-*.tsx'
      - 'src/video-producer-*.ts'
      - 'src/video-producer-*.tsx'
      - 'supabase/migrations/**'
      - 'supabase/rollback/**'
      - 'tests/studio-*.test.ts'
      - 'tests/video-producer-*.test.ts'
      - '.github/workflows/ag-studio-checks.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
