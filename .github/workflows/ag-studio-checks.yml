name: AG Studio checks

on:
  pull_request:
    paths:
      - 'app/studio/**'
      - 'app/output/**'
      - 'app/admin/**'
      - 'app/api/studio/**'
      - 'app/api/admin/**'
      - 'app/api/cron/**'
      - 'src/studio/**'
      - 'src/carousel-*'
      - 'public/fonts/**'
      - 'src/creative-*.ts'
      - 'src/creative-*.tsx'
      - 'src/sol-*.ts'
      - 'src/sol-*.tsx'
      - 'supabase/migrations/**'
      - 'supabase/rollback/**'
      - 'tests/studio-*.test.ts'
      - '.github/workflows/ag-studio-checks.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Lint changed Code Mode TypeScript and TSX
        run: |
          git fetch origin main --depth=1
          git diff --name-only -z origin/main HEAD -- '*.ts' '*.tsx' | xargs -0 -r npx eslint
      - run: npm run typecheck
      - run: npm run build
      - name: Verify Code Mode Chromium exports
        env:
          CAROUSEL_CHROMIUM_PATH: /tmp/carousel-code-chromium
        run: |
          node -e "const f=require('fs'),z=require('zlib');f.writeFileSync(process.env.CAROUSEL_CHROMIUM_PATH,z.brotliDecompressSync(f.readFileSync('node_modules/@sparticuz/chromium/bin/chromium.br')));f.chmodSync(process.env.CAROUSEL_CHROMIUM_PATH,0o755)"
          node --conditions=react-server --import tsx scripts/carousel-code-proof.ts
      - run: npx playwright install --with-deps chromium --only-shell
      - run: node scripts/carousel-browser-proof.mjs
      - name: Install FFmpeg for end-to-end MP4 proof
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Verify deterministic kinetic video scene frames
        run: node --import tsx scripts/check_video_scene_frames.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carousel-studio-proof
          path: |
            docs/carousel-studio-3/
            docs/carousel-code-mode/
