name: AG Studio checks

on:
  pull_request:
    paths:
      - 'app/studio/**'
      - 'app/output/**'
      - 'app/admin/**'
      - 'app/api/studio/**'
      - 'app/api/admin/**'
      - 'app/api/cron/**'
      - 'src/studio/**'
      - 'src/creative-*.ts'
      - 'src/creative-*.tsx'
      - 'src/sol-*.ts'
      - 'src/sol-*.tsx'
      - 'supabase/migrations/**'
      - 'supabase/rollback/**'
      - 'tests/studio-*.test.ts'
      - '.github/workflows/ag-studio-checks.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium --only-shell
      - run: node scripts/carousel-browser-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carousel-studio-proof
          path: docs/carousel-studio-3/
