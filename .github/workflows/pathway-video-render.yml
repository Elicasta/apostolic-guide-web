name: Pathway video render

on:
  repository_dispatch:
    types: [pathway-video-render]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out renderer
        uses: actions/checkout@v4

      - name: Prepare ffmpeg and fonts
        shell: bash
        run: |
          missing=()
          command -v ffmpeg >/dev/null 2>&1 || missing+=(ffmpeg)
          if ! fc-match "Noto Sans" 2>/dev/null | grep -qi "Noto"; then
            missing+=(fonts-noto-core)
          fi
          if ((${#missing[@]})); then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi

      - name: Write render payload
        env:
          RENDER_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          printf '%s' "$RENDER_PAYLOAD" > /tmp/pathway-video-payload.json

      - name: Detect kinetic composition requirement
        id: kinetic
        run: |
          python3 - <<'PY'
          import json, os
          payload=json.load(open('/tmp/pathway-video-payload.json', encoding='utf-8'))
          active=isinstance(payload.get('style'),dict) and payload['style'].get('kineticSceneV2') is not None
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('enabled='+('true' if active else 'false')+'\n')
          PY
      - name: Prepare Node for Studio scenes
        if: steps.kinetic.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium compositor for Studio scenes
        if: steps.kinetic.outputs.enabled == 'true'
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium --only-shell
      - name: Render, upload, and report status
        run: |
          python3 scripts/render_pathway_video_worker.py /tmp/pathway-video-payload.json /tmp/pathway-video.mp4
