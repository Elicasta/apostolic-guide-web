name: Video Producer transcription

on:
  repository_dispatch:
    types: [video-producer-transcribe]

permissions:
  contents: read

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out worker
        uses: actions/checkout@v4

      - name: Prepare ffmpeg
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: Write worker payload
        env:
          WORKER_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          printf '%s' "$WORKER_PAYLOAD" > /tmp/video-producer-transcribe.json

      - name: Extract, chunk, transcribe, and report
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 scripts/transcribe_video_producer_worker.py /tmp/video-producer-transcribe.json
